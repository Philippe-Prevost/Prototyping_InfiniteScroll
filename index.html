<!DOCTYPE html>
<html>

<head>

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: black;

            touch-action: none;

            font-family: sans-serif;
        }

        video {

            position: absolute;

            width: 100vw;
            height: 100vh;

            object-fit: cover;

            top: 0;
            left: 0;

            background: black;

            will-change: transform;
        }

        #label {

            position: fixed;

            top: 10px;
            left: 10px;

            color: white;

            background: rgba(0,0,0,0.4);

            padding: 6px 10px;

            border-radius: 8px;

            z-index: 100;
        }

        /* ----------------------------- */
        /* CONTROLS */
        /* ----------------------------- */

        #controls {

            position: fixed;

            top: 55px;
            left: 10px;

            z-index: 200;

            color: white;
        }

        .controlGroup {

            margin-bottom: 12px;

            background: rgba(0,0,0,0.35);

            padding: 8px 10px;

            border-radius: 10px;

            width: fit-content;
        }

        .controlLabel {

            margin-bottom: 8px;

            font-size: 13px;
        }

        .boxes {

            display: flex;

            gap: 6px;
        }

        .box {

            width: 28px;
            height: 28px;

            border: 1px solid white;

            border-radius: 5px;

            opacity: 0.25;

            transition: 0.2s;
        }

        .box.active {

            background: white;

            opacity: 1;
        }

        button {

            border: none;

            padding: 8px 14px;

            border-radius: 6px;

            font-weight: bold;

            cursor: pointer;
        }

        /* ----------------------------- */
        /* PLAY OVERLAY */
        /* ----------------------------- */

        #playOverlay {

            position: fixed;

            inset: 0;

            display: none;

            justify-content: center;
            align-items: center;

            z-index: 500;

            pointer-events: none;
        }

        #playCircle {

            width: 90px;
            height: 90px;

            border-radius: 50%;

            background: rgba(0,0,0,0.45);

            display: flex;

            justify-content: center;
            align-items: center;

            backdrop-filter: blur(6px);
        }

        #playTriangle {

            width: 0;
            height: 0;

            border-left: 28px solid white;

            border-top: 18px solid transparent;

            border-bottom: 18px solid transparent;

            margin-left: 6px;
        }

        /* ----------------------------- */
        /* SENSOR PANEL */
        /* ----------------------------- */

        #sensorPanel {

            position: fixed;

            bottom: 10px;
            left: 10px;

            z-index: 300;

            width: 340px;
        }

        #sensorNumbers {

            background: rgba(0,0,0,0.45);

            padding: 10px;

            border-radius: 10px;

            margin-bottom: 8px;

            font-family: monospace;

            line-height: 1.6;
        }

        .sensorLine {

            display: flex;

            justify-content: space-between;

            margin-bottom: 4px;

            font-size: 13px;
        }

        .accelText {

            color: #ff4d4d;
        }

        .gyroText {

            color: #4da6ff;
        }

        #motionGraph {

            width: 340px;
            height: 140px;

            background: rgba(0,0,0,0.35);

            border-radius: 10px;
        }

    </style>

</head>

<body>

    <!-- LABEL -->

    <div id="label">
        Infinite Scroll Prototype
    </div>

    <!-- CONTROLS -->

    <div id="controls">

        <div class="controlGroup">

            <div class="controlLabel">
                Autoplay
            </div>

            <button id="autoplayBtn">
                ON
            </button>

        </div>

        <div class="controlGroup">

            <div class="controlLabel">
                Swipe Tension
            </div>

            <div
                class="boxes"
                id="tensionBoxes">
            </div>

        </div>

        <div class="controlGroup">

            <div class="controlLabel">
                Transition Delay
            </div>

            <div
                class="boxes"
                id="paceBoxes">
            </div>

        </div>

    </div>

    <!-- PLAY OVERLAY -->

    <div id="playOverlay">

        <div id="playCircle">

            <div id="playTriangle"></div>

        </div>

    </div>

    <!-- SENSOR PANEL -->

    <div id="sensorPanel">

        <div id="sensorNumbers"></div>

        <canvas id="motionGraph"></canvas>

    </div>

    <!-- VIDEOS -->

    <video
        id="current"
        muted
        playsinline>
    </video>

    <video
        id="next"
        muted
        playsinline>
    </video>

    <script>

        // ---------------------------------
        // VIDEOS
        // ---------------------------------

        const videos = [

            "vid1.mp4",
            "vid2.mp4",
            "vid3.mp4",
            "vid4.mp4",
            "vid5.mp4",
            "vid6.mp4",
            "vid7.mp4",
            "vid8.mp4"

        ];

        // ---------------------------------
        // ELEMENTS
        // ---------------------------------

        let current =
            document.getElementById("current");

        let next =
            document.getElementById("next");

        const playOverlay =
            document.getElementById("playOverlay");

        const sensorNumbers =
            document.getElementById("sensorNumbers");

        const canvas =
            document.getElementById("motionGraph");

        const ctx =
            canvas.getContext("2d");

        canvas.width = 340;
        canvas.height = 140;

        // ---------------------------------
        // SETTINGS
        // ---------------------------------

        let autoplayEnabled = true;

        let swipeTension = 2;

        let transitionPace = 2;

        // ---------------------------------
        // MAPS
        // ---------------------------------

        const thresholdMap = {

            1: 60,
            2: 120,
            3: 180,
            4: 260,
            5: 360

        };

        const paceMap = {

            1: 0,
            2: 150,
            3: 400,
            4: 900,
            5: 1600

        };

        // ---------------------------------
        // SENSOR DATA
        // ---------------------------------

        let accMagnitude = 0;
        let rotMagnitude = 0;

        let smoothAcc = 0;
        let smoothRot = 0;

        let accHistory = [];
        let rotHistory = [];

        const maxPoints = 340;

        // ---------------------------------
        // SESSION
        // ---------------------------------

        let currentIndex = 0;

        // ---------------------------------
        // PLAY OVERLAY
        // ---------------------------------

        function showPlayOverlay() {

            playOverlay.style.display =
                "flex";

        }

        function hidePlayOverlay() {

            playOverlay.style.display =
                "none";

        }

        // ---------------------------------
        // AUTOPLAY BUTTON
        // ---------------------------------

        const autoplayBtn =
            document.getElementById("autoplayBtn");

        autoplayBtn.addEventListener(
            "click",
            () => {

                autoplayEnabled =
                    !autoplayEnabled;

                autoplayBtn.innerText =

                    autoplayEnabled
                    ? "ON"
                    : "OFF";

                if (!autoplayEnabled) {

                    current.pause();

                    showPlayOverlay();

                }

                else {

                    current.play();

                    hidePlayOverlay();

                }

            }
        );

        // ---------------------------------
        // CREATE BOXES
        // ---------------------------------

        function createBoxes(
            containerId,
            currentValue,
            callback
        ) {

            const container =
                document.getElementById(containerId);

            container.innerHTML = "";

            for (let i = 1; i <= 5; i++) {

                const box =
                    document.createElement("div");

                box.classList.add("box");

                if (i <= currentValue) {

                    box.classList.add("active");

                }

                box.addEventListener(
                    "click",
                    () => {

                        callback(i);

                        createBoxes(
                            containerId,
                            i,
                            callback
                        );

                    }
                );

                container.appendChild(box);

            }

        }

        // ---------------------------------
        // INIT CONTROLS
        // ---------------------------------

        createBoxes(
            "tensionBoxes",
            swipeTension,
            value => {

                swipeTension = value;

            }
        );

        createBoxes(
            "paceBoxes",
            transitionPace,
            value => {

                transitionPace = value;

            }
        );

        // ---------------------------------
        // PRELOAD
        // ---------------------------------

        function preload(index) {

            const file =
                videos[index % videos.length];

            next.preload = "auto";

            next.src = file;

            next.load();

            next.pause();

        }

        // ---------------------------------
        // START
        // ---------------------------------

        current.src = videos[0];

        current.load();

        current.play().catch(
            err => {
                console.log(err);
            }
        );

        preload(1);

        current.style.transform =
            "translateY(0vh)";

        next.style.transform =
            "translateY(100vh)";

        // ---------------------------------
        // TAP TO PLAY
        // ---------------------------------

        document.addEventListener(
            "click",
            () => {

                if (!autoplayEnabled) {

                    current.play();

                    hidePlayOverlay();

                }

            }
        );

        // ---------------------------------
        // SENSOR SAMPLING
        // ---------------------------------

        let lastSensorUpdate = 0;

        window.addEventListener(
            "devicemotion",
            e => {

                const now = Date.now();

                if (
                    now - lastSensorUpdate < 50
                ) return;

                lastSensorUpdate = now;

                // -------------------------
                // ACCELEROMETER
                // -------------------------

                const acc =
                    e.accelerationIncludingGravity;

                if (acc) {

                    const x = acc.x || 0;
                    const y = acc.y || 0;
                    const z = acc.z || 0;

                    accMagnitude = Math.sqrt(

                        x*x +
                        y*y +
                        z*z

                    );

                }

                // -------------------------
                // GYROSCOPE
                // -------------------------

                const rot =
                    e.rotationRate;

                if (rot) {

                    const x = rot.alpha || 0;
                    const y = rot.beta || 0;
                    const z = rot.gamma || 0;

                    rotMagnitude = Math.sqrt(

                        x*x +
                        y*y +
                        z*z

                    );

                }

                // -------------------------
                // SMOOTHING
                // -------------------------

                smoothAcc =

                    smoothAcc * 0.9
                    + accMagnitude * 0.1;

                smoothRot =

                    smoothRot * 0.9
                    + rotMagnitude * 0.1;

                // -------------------------
                // HISTORY
                // -------------------------

                accHistory.push(smoothAcc);
                rotHistory.push(smoothRot);

                if (accHistory.length > maxPoints) {

                    accHistory.shift();
                    rotHistory.shift();

                }

                // -------------------------
                // TEXT DISPLAY
                // -------------------------

                sensorNumbers.innerHTML = `

<div class="sensorLine accelText">

<span>ACCEL</span>

<span>${smoothAcc.toFixed(2)}</span>

</div>

<div class="sensorLine gyroText">

<span>GYRO</span>

<span>${smoothRot.toFixed(2)}</span>

</div>

                `;

            }
        );

        // ---------------------------------
        // GRAPH
        // ---------------------------------

        function drawGraph() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            // -------------------------
            // ACCEL GRAPH
            // -------------------------

            ctx.beginPath();

            ctx.strokeStyle = "#ff4d4d";

            ctx.lineWidth = 2;

            accHistory.forEach((v, i) => {

                const y =
                    canvas.height - (v * 4);

                if (i === 0) {

                    ctx.moveTo(i, y);

                }

                else {

                    ctx.lineTo(i, y);

                }

            });

            ctx.stroke();

            // -------------------------
            // GYRO GRAPH
            // -------------------------

            ctx.beginPath();

            ctx.strokeStyle = "#4da6ff";

            ctx.lineWidth = 2;

            rotHistory.forEach((v, i) => {

                const y =
                    canvas.height - (v * 0.5);

                if (i === 0) {

                    ctx.moveTo(i, y);

                }

                else {

                    ctx.lineTo(i, y);

                }

            });

            ctx.stroke();

            requestAnimationFrame(drawGraph);

        }

        drawGraph();

        // ---------------------------------
        // DRAGGING
        // ---------------------------------

        let dragging = false;

        let startY = 0;

        let currentY = 0;

        // ---------------------------------
        // TOUCH START
        // ---------------------------------

        document.addEventListener(
            "touchstart",
            e => {

                dragging = true;

                startY =
                    e.touches[0].clientY;

                currentY = startY;

                current.style.transition =
                    "none";

                next.style.transition =
                    "none";

            }
        );

        // ---------------------------------
        // TOUCH MOVE
        // ---------------------------------

        document.addEventListener(
            "touchmove",
            e => {

                if (!dragging) return;

                currentY =
                    e.touches[0].clientY;

                let deltaY =
                    currentY - startY;

                if (deltaY < 0) {

                    current.style.transform =

                        `translateY(${deltaY}px)`;

                    next.style.transform =

                        `translateY(${window.innerHeight + deltaY}px)`;

                }

            }
        );

        // ---------------------------------
        // TOUCH END
        // ---------------------------------

        document.addEventListener(
            "touchend",
            e => {

                dragging = false;

                let dy =

                    e.changedTouches[0].clientY
                    - startY;

                current.style.transition =
                    "transform 0.3s ease";

                next.style.transition =
                    "transform 0.3s ease";

                const swipeThreshold =
                    thresholdMap[swipeTension];

                const transitionDelay =
                    paceMap[transitionPace];

                // COMPLETE SWIPE

                if (dy < -swipeThreshold) {

                    current.style.transform =
                        "translateY(-100vh)";

                    next.style.transform =
                        "translateY(0vh)";

                    setTimeout(() => {

                        let temp = current;

                        current = next;

                        next = temp;

                        current.style.transition =
                            "none";

                        next.style.transition =
                            "none";

                        current.style.transform =
                            "translateY(0vh)";

                        next.style.transform =
                            "translateY(100vh)";

                        currentIndex =

                            (currentIndex + 1)
                            % videos.length;

                        preload(currentIndex + 1);

                        if (autoplayEnabled) {

                            hidePlayOverlay();

                            current.play().catch(
                                err => {
                                    console.log(err);
                                }
                            );

                        }

                        else {

                            current.pause();

                            showPlayOverlay();

                        }

                    }, 300 + transitionDelay);

                }

                // SNAP BACK

                else {

                    current.style.transform =
                        "translateY(0vh)";

                    next.style.transform =
                        "translateY(100vh)";

                }

            }
        );

    </script>

</body>

</html>
