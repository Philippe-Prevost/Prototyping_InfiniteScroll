<!DOCTYPE html>
<html>

<head>

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: black;

            touch-action: none;

            font-family: sans-serif;
        }

        video {

            position: absolute;

            width: 100vw;
            height: 100vh;

            object-fit: cover;

            top: 0;
            left: 0;

            background: black;

            will-change: transform;
        }

        #label {

            position: fixed;

            top: 10px;
            left: 10px;

            color: white;

            background: rgba(0,0,0,0.5);

            padding: 6px 10px;

            border-radius: 8px;

            z-index: 100;
        }

        /* ----------------------------- */
        /* CONTROLS */
        /* ----------------------------- */

        #controls {

            position: fixed;

            top: 60px;
            left: 10px;

            z-index: 200;

            width: 240px;

            background: rgba(0,0,0,0.7);

            color: white;

            padding: 14px;

            border-radius: 12px;

            backdrop-filter: blur(10px);
        }

        .controlGroup {

            margin-bottom: 18px;
        }

        .controlLabel {

            margin-bottom: 8px;

            font-size: 13px;
        }

        .boxes {

            display: flex;

            gap: 6px;
        }

        .box {

            width: 28px;
            height: 28px;

            border: 1px solid white;

            border-radius: 5px;

            opacity: 0.25;

            transition: 0.2s;
        }

        .box.active {

            background: white;

            opacity: 1;
        }

        button {

            border: none;

            padding: 8px 14px;

            border-radius: 6px;

            font-weight: bold;

            cursor: pointer;
        }

    </style>

</head>

<body>

    <!-- LABEL -->

    <div id="label">
        Infinite Scroll Prototype
    </div>

    <!-- CONTROLS -->

    <div id="controls">

        <!-- AUTOPLAY -->

        <div class="controlGroup">

            <div class="controlLabel">
                Autoplay
            </div>

            <button id="autoplayBtn">
                ON
            </button>

        </div>

        <!-- SWIPE TENSION -->

        <div class="controlGroup">

            <div class="controlLabel">
                Swipe Tension
            </div>

            <div
                class="boxes"
                id="tensionBoxes">
            </div>

        </div>

        <!-- TRANSITION PACE -->

        <div class="controlGroup">

            <div class="controlLabel">
                Transition Pace
            </div>

            <div
                class="boxes"
                id="paceBoxes">
            </div>

        </div>

    </div>

    <!-- VIDEOS -->

    <video
        id="current"
        muted
        playsinline></video>

    <video
        id="next"
        muted
        playsinline></video>

    <script>

        // ---------------------------------
        // VIDEOS
        // ---------------------------------

        const videos = [

            "vid1.mp4",
            "vid2.mp4",
            "vid3.mp4",
            "vid4.mp4",
            "vid5.mp4",
            "vid6.mp4"

        ];

        // ---------------------------------
        // ELEMENTS
        // ---------------------------------

        let current =
            document.getElementById("current");

        let next =
            document.getElementById("next");

        // ---------------------------------
        // SETTINGS
        // ---------------------------------

        let autoplayEnabled = true;

        // 1 → 5
        let swipeTension = 2;

        // 1 → 5
        let transitionPace = 2;

        // ---------------------------------
        // SESSION
        // ---------------------------------

        let currentIndex = 0;

        // ---------------------------------
        // MAPS
        // ---------------------------------

        const thresholdMap = {

            1: 60,
            2: 120,
            3: 180,
            4: 240,
            5: 320

        };

        const paceMap = {

            1: 0,
            2: 250,
            3: 700,
            4: 1400,
            5: 2200

        };

        // ---------------------------------
        // AUTOPLAY BUTTON
        // ---------------------------------

        const autoplayBtn =
            document.getElementById("autoplayBtn");

        autoplayBtn.addEventListener(
            "click",
            () => {

                autoplayEnabled =
                    !autoplayEnabled;

                autoplayBtn.innerText =

                    autoplayEnabled
                    ? "ON"
                    : "OFF";

            }
        );

        // ---------------------------------
        // CREATE BOXES
        // ---------------------------------

        function createBoxes(
            containerId,
            currentValue,
            callback
        ) {

            const container =
                document.getElementById(containerId);

            container.innerHTML = "";

            for (let i = 1; i <= 5; i++) {

                const box =
                    document.createElement("div");

                box.classList.add("box");

                if (i <= currentValue) {

                    box.classList.add("active");

                }

                box.addEventListener(
                    "click",
                    () => {

                        callback(i);

                        createBoxes(
                            containerId,
                            i,
                            callback
                        );

                    }
                );

                container.appendChild(box);

            }

        }

        // ---------------------------------
        // INIT CONTROLS
        // ---------------------------------

        createBoxes(
            "tensionBoxes",
            swipeTension,
            value => {

                swipeTension = value;

            }
        );

        createBoxes(
            "paceBoxes",
            transitionPace,
            value => {

                transitionPace = value;

            }
        );

        // ---------------------------------
        // PRELOAD
        // ---------------------------------

        function preload(index) {

            const file =
                videos[index % videos.length];

            next.preload = "auto";

            next.src = file;

            next.load();

        }

        // ---------------------------------
        // INITIAL VIDEO
        // ---------------------------------

        current.src = videos[0];

        current.load();

        if (autoplayEnabled) {

            current.play();

        }

        preload(1);

        current.style.transform =
            "translateY(0vh)";

        next.style.transform =
            "translateY(100vh)";

        // ---------------------------------
        // DRAGGING
        // ---------------------------------

        let dragging = false;

        let startY = 0;

        let currentY = 0;

        // ---------------------------------
        // TOUCH START
        // ---------------------------------

        document.addEventListener(
            "touchstart",
            e => {

                dragging = true;

                startY =
                    e.touches[0].clientY;

                currentY = startY;

                current.style.transition =
                    "none";

                next.style.transition =
                    "none";

            }
        );

        // ---------------------------------
        // TOUCH MOVE
        // ---------------------------------

        document.addEventListener(
            "touchmove",
            e => {

                if (!dragging) return;

                currentY =
                    e.touches[0].clientY;

                let deltaY =
                    currentY - startY;

                if (deltaY < 0) {

                    current.style.transform =

                        `translateY(${deltaY}px)`;

                    next.style.transform =

                        `translateY(${window.innerHeight + deltaY}px)`;

                }

            }
        );

        // ---------------------------------
        // TOUCH END
        // ---------------------------------

        document.addEventListener(
            "touchend",
            e => {

                dragging = false;

                let dy =

                    e.changedTouches[0].clientY
                    - startY;

                current.style.transition =
                    "transform 0.3s ease";

                next.style.transition =
                    "transform 0.3s ease";

                // ---------------------------------
                // SWIPE THRESHOLD
                // ---------------------------------

                const swipeThreshold =
                    thresholdMap[swipeTension];

                // ---------------------------------
                // TRANSITION DELAY
                // ---------------------------------

                const transitionDelay =
                    paceMap[transitionPace];

                // ---------------------------------
                // COMPLETE SWIPE
                // ---------------------------------

                if (dy < -swipeThreshold) {

                    current.style.transform =
                        "translateY(-100vh)";

                    next.style.transform =
                        "translateY(0vh)";

                    setTimeout(() => {

                        let temp = current;

                        current = next;

                        next = temp;

                        current.style.transition =
                            "none";

                        next.style.transition =
                            "none";

                        current.style.transform =
                            "translateY(0vh)";

                        next.style.transform =
                            "translateY(100vh)";

                        currentIndex =

                            (currentIndex + 1)
                            % videos.length;

                        preload(currentIndex + 1);

                        if (autoplayEnabled) {

                            current.play().catch(
                                err => {
                                    console.log(err);
                                }
                            );

                        }

                    }, 300 + transitionDelay);

                }

                // ---------------------------------
                // SNAP BACK
                // ---------------------------------

                else {

                    current.style.transform =
                        "translateY(0vh)";

                    next.style.transform =
                        "translateY(100vh)";

                }

            }
        );

    </script>

</body>

</html>
