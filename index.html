<!DOCTYPE html>
<html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html,
        body {

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: black;

            touch-action: none;

            font-family: sans-serif;
        }

        video {

            position: absolute;

            width: 100vw;
            height: 100vh;

            object-fit: cover;

            top: 0;
            left: 0;

            background: black;

            will-change: transform;
        }

        #label {

            position: fixed;

            top: 10px;
            left: 10px;

            color: white;

            background: rgba(0, 0, 0, 0.4);

            padding: 6px 10px;

            border-radius: 8px;

            z-index: 100;
        }

        /* ----------------------------- */
        /* CONTROLS */
        /* ----------------------------- */

        #controls {

            position: fixed;

            top: 55px;
            left: 10px;

            z-index: 200;

            color: white;
        }

        .controlGroup {

            margin-bottom: 12px;

            background: rgba(0, 0, 0, 0.35);

            padding: 8px 10px;

            border-radius: 10px;

            width: fit-content;
        }

        .controlLabel {

            margin-bottom: 8px;

            font-size: 13px;
        }

        .boxes {

            display: flex;

            gap: 6px;
        }

        .box {

            width: 28px;
            height: 28px;

            border: 1px solid white;

            border-radius: 5px;

            opacity: 0.25;

            transition: 0.2s;
        }

        .box.active {

            background: white;

            opacity: 1;
        }

        button {

            border: none;

            padding: 8px 14px;

            border-radius: 6px;

            font-weight: bold;

            cursor: pointer;
        }

        /* ----------------------------- */
        /* PLAY OVERLAY */
        /* ----------------------------- */

        #playOverlay {

            position: fixed;

            inset: 0;

            display: none;

            justify-content: center;
            align-items: center;

            z-index: 500;

            pointer-events: none;
        }

        #playCircle {

            width: 90px;
            height: 90px;

            border-radius: 50%;

            background: rgba(0, 0, 0, 0.45);

            display: flex;

            justify-content: center;
            align-items: center;

            backdrop-filter: blur(6px);
        }

        #playTriangle {

            width: 0;
            height: 0;

            border-left: 28px solid white;

            border-top: 18px solid transparent;

            border-bottom: 18px solid transparent;

            margin-left: 6px;
        }

        /* ----------------------------- */
        /* SENSOR PANEL */
        /* ----------------------------- */

        #sensorPanel {

            position: fixed;

            bottom: 10px;
            left: 10px;

            z-index: 300;

            color: white;

            font-family: monospace;

            font-size: 11px;
        }

        #sensorNumbers {

            background: rgba(0, 0, 0, 0.4);

            padding: 8px;

            border-radius: 8px;

            margin-bottom: 8px;

            line-height: 1.5;
        }

        #motionGraph {

            width: 320px;
            height: 120px;

            background: rgba(0, 0, 0, 0.35);

            border-radius: 8px;
        }
    </style>

</head>

<body>

    <!-- LABEL -->

    <div id="label">
        Infinite Scroll Prototype
    </div>

    <!-- CONTROLS -->

    <div id="controls">

        <!-- AUTOPLAY -->

        <div class="controlGroup">

            <div class="controlLabel">
                Autoplay
            </div>

            <button id="autoplayBtn">
                ON
            </button>

        </div>

        <!-- SWIPE TENSION -->

        <div class="controlGroup">

            <div class="controlLabel">
                Swipe Tension
            </div>

            <div class="boxes" id="tensionBoxes">
            </div>

        </div>

        <!-- TRANSITION PACE -->

        <div class="controlGroup">

            <div class="controlLabel">
                Transition Pace
            </div>

            <div class="boxes" id="paceBoxes">
            </div>

        </div>

    </div>

    <!-- PLAY OVERLAY -->

    <div id="playOverlay">

        <div id="playCircle">

            <div id="playTriangle"></div>

        </div>

    </div>

    <!-- SENSOR PANEL -->

    <div id="sensorPanel">

        <div id="sensorNumbers">
            Waiting for sensors...
        </div>

        <canvas id="motionGraph"></canvas>

    </div>

    <!-- VIDEOS -->

    <video id="current" muted playsinline>
    </video>

    <video id="next" muted playsinline>
    </video>

    <script>

        // ---------------------------------
        // VIDEOS
        // ---------------------------------

        const videos = [

            "videos/vid1.mp4",
            "videos/vid2.mp4",
            "videos/vid3.mp4",
            "videos/vid4.mp4",
            "videos/vid5.mp4",
            "videos/vid6.mp4"

        ];

        // ---------------------------------
        // ELEMENTS
        // ---------------------------------

        let current =
            document.getElementById("current");

        let next =
            document.getElementById("next");

        const playOverlay =
            document.getElementById("playOverlay");

        const sensorNumbers =
            document.getElementById("sensorNumbers");

        const canvas =
            document.getElementById("motionGraph");

        const ctx =
            canvas.getContext("2d");

        canvas.width = 320;
        canvas.height = 120;

        // ---------------------------------
        // SETTINGS
        // ---------------------------------

        let autoplayEnabled = true;

        let swipeTension = 2;

        let transitionPace = 2;

        // ---------------------------------
        // MAPS
        // ---------------------------------

        const thresholdMap = {

            1: 60,
            2: 120,
            3: 180,
            4: 260,
            5: 360

        };

        const paceMap = {

            1: 0,
            2: 150,
            3: 400,
            4: 900,
            5: 1600

        };

        // ---------------------------------
        // SENSOR DATA
        // ---------------------------------

        let accX = 0;
        let accY = 0;
        let accZ = 0;

        let accMagnitude = 0;

        let rotX = 0;
        let rotY = 0;
        let rotZ = 0;

        let rotMagnitude = 0;

        let accHistory = [];
        let rotHistory = [];

        const maxPoints = 320;

        // ---------------------------------
        // SESSION
        // ---------------------------------

        let currentIndex = 0;

        // ---------------------------------
        // PLAY OVERLAY
        // ---------------------------------

        function showPlayOverlay() {

            playOverlay.style.display =
                "flex";

        }

        function hidePlayOverlay() {

            playOverlay.style.display =
                "none";

        }

        // ---------------------------------
        // AUTOPLAY BUTTON
        // ---------------------------------

        const autoplayBtn =
            document.getElementById("autoplayBtn");

        autoplayBtn.addEventListener(
            "click",
            () => {

                autoplayEnabled =
                    !autoplayEnabled;

                autoplayBtn.innerText =

                    autoplayEnabled
                        ? "ON"
                        : "OFF";

                if (!autoplayEnabled) {

                    current.pause();

                    showPlayOverlay();

                }

                else {

                    current.play();

                    hidePlayOverlay();

                }

            }
        );

        // ---------------------------------
        // CREATE BOXES
        // ---------------------------------

        function createBoxes(
            containerId,
            currentValue,
            callback
        ) {

            const container =
                document.getElementById(containerId);

            container.innerHTML = "";

            for (let i = 1; i <= 5; i++) {

                const box =
                    document.createElement("div");

                box.classList.add("box");

                if (i <= currentValue) {

                    box.classList.add("active");

                }

                box.addEventListener(
                    "click",
                    () => {

                        callback(i);

                        createBoxes(
                            containerId,
                            i,
                            callback
                        );

                    }
                );

                container.appendChild(box);

            }

        }

        // ---------------------------------
        // INIT CONTROLS
        // ---------------------------------

        createBoxes(
            "tensionBoxes",
            swipeTension,
            value => {

                swipeTension = value;

            }
        );

        createBoxes(
            "paceBoxes",
            transitionPace,
            value => {

                transitionPace = value;

            }
        );

        // ---------------------------------
        // PRELOAD
        // ---------------------------------

        function preload(index) {

            const file =
                videos[index % videos.length];

            next.preload = "auto";

            next.src = file;

            next.load();

            next.pause();

        }

        // ---------------------------------
        // START
        // ---------------------------------

        current.src = videos[0];

        current.load();

        current.play().catch(
            err => {
                console.log(err);
            }
        );

        preload(1);

        current.style.transform =
            "translateY(0vh)";

        next.style.transform =
            "translateY(100vh)";

        // ---------------------------------
        // TAP TO PLAY
        // ---------------------------------

        document.addEventListener(
            "click",
            () => {

                if (!autoplayEnabled) {

                    current.play();

                    hidePlayOverlay();

                }

            }
        );

        // ---------------------------------
        // MOTION SENSORS
        // ---------------------------------

        window.addEventListener(
            "devicemotion",
            e => {

                // ACCELEROMETER

                const acc =
                    e.accelerationIncludingGravity;

                if (acc) {

                    accX = acc.x || 0;
                    accY = acc.y || 0;
                    accZ = acc.z || 0;

                    accMagnitude = Math.sqrt(

                        accX * accX +
                        accY * accY +
                        accZ * accZ

                    );

                }

                // GYROSCOPE

                const rot =
                    e.rotationRate;

                if (rot) {

                    rotX = rot.alpha || 0;
                    rotY = rot.beta || 0;
                    rotZ = rot.gamma || 0;

                    rotMagnitude = Math.sqrt(

                        rotX * rotX +
                        rotY * rotY +
                        rotZ * rotZ

                    );

                }

                // STORE HISTORY

                accHistory.push(accMagnitude);
                rotHistory.push(rotMagnitude);

                if (accHistory.length > maxPoints) {

                    accHistory.shift();
                    rotHistory.shift();

                }

                // UPDATE TEXT

                sensorNumbers.innerHTML = `

ACCELEROMETER
x ${accX.toFixed(2)}
y ${accY.toFixed(2)}
z ${accZ.toFixed(2)}
m ${accMagnitude.toFixed(2)}

GYROSCOPE
x ${rotX.toFixed(2)}
y ${rotY.toFixed(2)}
z ${rotZ.toFixed(2)}
m ${rotMagnitude.toFixed(2)}

                `;

            }
        );

        // ---------------------------------
        // DRAW GRAPH
        // ---------------------------------

        function drawGraph() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            // ACCELERATION

            ctx.beginPath();

            ctx.strokeStyle = "white";

            accHistory.forEach((v, i) => {

                const y =
                    canvas.height - (v * 3);

                if (i === 0) {

                    ctx.moveTo(i, y);

                }

                else {

                    ctx.lineTo(i, y);

                }

            });

            ctx.stroke();

            // GYROSCOPE

            ctx.beginPath();

            ctx.strokeStyle =
                "rgba(255,255,255,0.4)";

            rotHistory.forEach((v, i) => {

                const y =
                    canvas.height - (v * 0.5);

                if (i === 0) {

                    ctx.moveTo(i, y);

                }

                else {

                    ctx.lineTo(i, y);

                }

            });

            ctx.stroke();

            requestAnimationFrame(drawGraph);

        }

        drawGraph();

        // ---------------------------------
        // DRAGGING
        // ---------------------------------

        let dragging = false;

        let startY = 0;

        let currentY = 0;

        // ---------------------------------
        // TOUCH START
        // ---------------------------------

        document.addEventListener(
            "touchstart",
            e => {

                dragging = true;

                startY =
                    e.touches[0].clientY;

                currentY = startY;

                current.style.transition =
                    "none";

                next.style.transition =
                    "none";

            }
        );

        // ---------------------------------
        // TOUCH MOVE
        // ---------------------------------

        document.addEventListener(
            "touchmove",
            e => {

                if (!dragging) return;

                currentY =
                    e.touches[0].clientY;

                let deltaY =
                    currentY - startY;

                if (deltaY < 0) {

                    current.style.transform =

                        `translateY(${deltaY}px)`;

                    next.style.transform =

                        `translateY(${window.innerHeight + deltaY}px)`;

                }

            }
        );

        // ---------------------------------
        // TOUCH END
        // ---------------------------------

        document.addEventListener(
            "touchend",
            e => {

                dragging = false;

                let dy =

                    e.changedTouches[0].clientY
                    - startY;

                current.style.transition =
                    "transform 0.3s ease";

                next.style.transition =
                    "transform 0.3s ease";

                const swipeThreshold =
                    thresholdMap[swipeTension];

                const transitionDelay =
                    paceMap[transitionPace];

                // COMPLETE SWIPE

                if (dy < -swipeThreshold) {

                    current.style.transform =
                        "translateY(-100vh)";

                    next.style.transform =
                        "translateY(0vh)";

                    setTimeout(() => {

                        let temp = current;

                        current = next;

                        next = temp;

                        current.style.transition =
                            "none";

                        next.style.transition =
                            "none";

                        current.style.transform =
                            "translateY(0vh)";

                        next.style.transform =
                            "translateY(100vh)";

                        currentIndex =

                            (currentIndex + 1)
                            % videos.length;

                        preload(currentIndex + 1);

                        if (autoplayEnabled) {

                            hidePlayOverlay();

                            current.play().catch(
                                err => {
                                    console.log(err);
                                }
                            );

                        }

                        else {

                            current.pause();

                            showPlayOverlay();

                        }

                    }, 300 + transitionDelay);

                }

                // SNAP BACK

                else {

                    current.style.transform =
                        "translateY(0vh)";

                    next.style.transform =
                        "translateY(100vh)";

                }

            }
        );

    </script>

</body>

</html>
